name: feedback_work
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  firebase_core: ^3.8.0 
  firebase_auth: ^5.3.3 
  cloud_firestore: ^5.5.0 
  google_sign_in: ^6.2.2 
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  flutter_facebook_auth: ^7.1.1
  file_picker: ^8.1.4
  intl: ^0.19.0
  dotted_border: ^2.1.0
  firebase_storage: ^12.3.7
  flutter_quill: ^10.8.5
  flutter_keyboard_visibility: ^6.0.0
  awesome_snackbar_content: ^0.1.4
  flutter_svg: ^2.0.16
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/onboard/
    - assets/images/icons/
    - assets/images/icons/nav-tab/
    - assets/images/solution_function/


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter_28pt-ExtraBold.ttf
          weight: 900




