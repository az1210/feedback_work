name: feedback_work
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  google_sign_in: ^6.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  flutter_facebook_auth: ^7.1.1
  file_picker: ^8.1.4
  intl: ^0.19.0
  dotted_border: ^2.1.0
  flutter_quill: ^10.8.5
  flutter_keyboard_visibility: ^6.0.0
  awesome_snackbar_content: ^0.1.4
  flutter_svg: ^2.0.16
  audioplayers: ^6.1.0
  flutter_screenutil: ^5.9.3
  device_preview: ^1.2.0
  logger: ^2.5.0
  flutter_staggered_grid_view: ^0.7.0
  date_time_format: ^2.0.1
  uuid: ^4.5.1
  fluttertoast: ^8.2.10
  flutter_stripe: ^11.4.0
  dio: ^5.8.0+1
  hive_flutter: ^1.1.0
  timelines_plus: ^1.0.6
  supabase_flutter: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/onboard/
    - assets/images/icons/
    - assets/images/icons/nav-tab/
    - assets/images/solution_function/
    - assets/svgs/


  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_24pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_18pt-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter_28pt-ExtraBold.ttf
          weight: 900




